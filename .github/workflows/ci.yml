name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  checks: write        # pour publier le rapport de test
  pull-requests: write # pour commenter les PR avec la couverture

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 : Initialisation, Restauration & Formatage (Lint)
  # ─────────────────────────────────────────────────────────────
  setup-and-lint:
    name: "⚙️ Setup & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restaurer les dépendances
        run: dotnet restore EscrimeGame.sln

      - name: Vérifier le formatage du code
        run: dotnet format EscrimeGame.sln whitespace --verify-no-changes

  # ─────────────────────────────────────────────────────────────
  # JOB 2 : Tests, Couverture de code & Rapports
  # ─────────────────────────────────────────────────────────────
  test:
    name: "🧪 Tests & Couverture"
    runs-on: ubuntu-latest
    needs: setup-and-lint # S'exécute uniquement si le setup/lint est OK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}

      - name: Exécuter les tests avec couverture
        run: >
          dotnet test EscrimeGame.sln
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      # ── Génération des rapports ──
      - name: Générer le rapport de couverture
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "TestResults/**/coverage.cobertura.xml"
          targetdir: "TestResults/CoverageReport"
          reporttypes: "HtmlInline;MarkdownSummaryGithub;Cobertura"
          verbosity: "Warning"

      - name: Publier la couverture dans le Job Summary
        run: cat TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Commenter la PR avec la couverture
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: TestResults/CoverageReport/SummaryGithub.md

      # Toujours publier les résultats, même si les tests échouent
      - name: Publier les résultats de test (.trx)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Résultats NUnit"
          path: "TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      - name: Archiver le rapport de couverture HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/CoverageReport/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 3 : Build Final (Release)
  # ─────────────────────────────────────────────────────────────
  build:
    name: "📦 Build App"
    runs-on: ubuntu-latest
    needs: test # Ne build que si les tests passent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}

      - name: Build (Release)
        run: dotnet build EscrimeGame.sln --configuration Release

      # Optionnel : Si vous souhaitez sauvegarder les fichiers exécutables produits
      - name: Archiver les binaires de l'application
        uses: actions/upload-artifact@v4
        with:
          name: escrime-game-binaries
          path: "**/bin/Release/net9.0/"
          retention-days: 7
